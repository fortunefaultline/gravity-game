<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>GRAVITY – Neon Edition</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b19;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:25px;left:0;width:100%;text-align:center;color:white;pointer-events:none}
#score{font-size:36px;font-weight:bold;text-shadow:0 0 15px #00eaff}
#best{font-size:13px;color:#aab4d6;margin-top:5px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,7,20,.8);color:white;text-align:center}
.panel{padding:30px}
h1{font-size:48px;letter-spacing:5px;color:#00eaff;text-shadow:0 0 25px #00eaff;margin-bottom:10px}
p{color:#b8c2e0;line-height:1.6}
button{margin-top:25px;padding:16px 45px;border:0;border-radius:30px;background:#00eaff;color:#06101c;font-size:18px;font-weight:bold;box-shadow:0 0 25px #00eaff}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
<div id="score">0</div>
<div id="best">BEST: 0</div>
</div>

<div id="overlay">
<div class="panel">
<h1>GRAVITY</h1>
<p>NEON EDITION</p>
<p>Tap anywhere to reverse gravity.<br>Avoid the red obstacles.<br>Survive as long as you can.</p>
<button id="start">PLAY</button>
</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const startBtn=document.getElementById("start");

let W,H,topY,bottomY;
let player,obstacles,particles;
let running=false,score=0,speed=4,spawnTimer=0;
let best=Number(localStorage.getItem("gravityBest")||0);
let lastTime=0;

bestEl.textContent="BEST: "+best;

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
 topY=H*.22;
 bottomY=H*.78;
}
resize();
addEventListener("resize",resize);

function reset(){
 player={x:W*.23,y:bottomY-13,r:13,gravity:1,vy:0};
 obstacles=[];
 particles=[];
 score=0;
 speed=4;
 spawnTimer=80;
 scoreEl.textContent="0";
 running=true;
 overlay.style.display="none";
}

function flip(){
 if(!running)return;
 player.gravity*=-1;
 player.vy=player.gravity*2;
 for(let i=0;i<15;i++){
 particles.push({
 x:player.x,y:player.y,
 vx:(Math.random()-.5)*7,
 vy:(Math.random()-.5)*7,
 life:25
 });
 }
}

startBtn.onclick=e=>{
 e.stopPropagation();
 reset();
};

canvas.addEventListener("pointerdown",flip);

function spawn(){
 const side=Math.random()<.5?"top":"bottom";
 const height=55+Math.random()*65;
 obstacles.push({
 x:W+30,
 w:30,
 side,
 height,
 passed:false
 });
}

function update(dt){
 if(!running)return;

 const step=Math.min(dt/16.67,2);
 speed=Math.min(9,4+score*.035);

 player.vy+=player.gravity*.55*step;
 player.y+=player.vy*step;

 const minY=topY+player.r;
 const maxY=bottomY-player.r;

 if(player.y<minY){
 player.y=minY;
 player.vy=0;
 }
 if(player.y>maxY){
 player.y=maxY;
 player.vy=0;
 }

 spawnTimer-=step;
 if(spawnTimer<=0){
 spawn();
 spawnTimer=Math.max(35,85-score*.3);
 }

 for(const o of obstacles){
 o.x-=speed*step;

 if(!o.passed&&o.x+o.w<player.x-player.r){
 o.passed=true;
 score++;
 scoreEl.textContent=score;
 }

 const oy=o.side==="top"?topY:bottomY-o.height;

 if(player.x+player.r>o.x &&
 player.x-player.r<o.x+o.w &&
 player.y+player.r>oy &&
 player.y-player.r<oy+o.height){
 gameOver();
 }
 }

 obstacles=obstacles.filter(o=>o.x+o.w>0);

 for(const p of particles){
 p.x+=p.vx*step;
 p.y+=p.vy*step;
 p.life-=step;
 }
 particles=particles.filter(p=>p.life>0);
}

function gameOver(){
 running=false;

 if(score>best){
 best=score;
 localStorage.setItem("gravityBest",best);
 bestEl.textContent="BEST: "+best;
 }

 overlay.style.display="flex";
 overlay.querySelector("h1").textContent="GAME OVER";
 overlay.querySelector("p").textContent="SCORE: "+score;
 startBtn.textContent="RETRY";
}

function draw(){
 ctx.fillStyle="#080b19";
 ctx.fillRect(0,0,W,H);

 ctx.strokeStyle="rgba(0,234,255,.08)";
 ctx.lineWidth=1;

 for(let x=0;x<W;x+=40){
 ctx.beginPath();
 ctx.moveTo(x,topY);
 ctx.lineTo(x,bottomY);
 ctx.stroke();
 }

 for(let y=topY;y<bottomY;y+=40){
 ctx.beginPath();
 ctx.moveTo(0,y);
 ctx.lineTo(W,y);
 ctx.stroke();
 }

 ctx.shadowBlur=20;
 ctx.shadowColor="#00eaff";
 ctx.strokeStyle="#00eaff";
 ctx.lineWidth=3;

 ctx.beginPath();
 ctx.moveTo(0,topY);
 ctx.lineTo(W,topY);
 ctx.moveTo(0,bottomY);
 ctx.lineTo(W,bottomY);
 ctx.stroke();

 ctx.shadowColor="#ff245f";

 for(const o of obstacles){
 const y=o.side==="top"?topY:bottomY-o.height;
 ctx.fillStyle="#ff245f";
 ctx.fillRect(o.x,y,o.w,o.height);
 }

 ctx.shadowColor="#00eaff";
 ctx.shadowBlur=25;
 ctx.fillStyle="#00eaff";

 if(player){
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
 ctx.fill();
 }

 ctx.shadowBlur=10;

 for(const p of particles||[]){
 ctx.globalAlpha=Math.max(0,p.life/25);
 ctx.fillStyle="#b86cff";
 ctx.fillRect(p.x,p.y,4,4);
 }

 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
}

function loop(time){
 const dt=lastTime?time-lastTime:16.67;
 lastTime=time;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

player={x:W*.23,y:bottomY-13,r:13,gravity:1,vy:0};
obstacles=[];
particles=[];
requestAnimationFrame(loop);
</script>
</body>
</html>
